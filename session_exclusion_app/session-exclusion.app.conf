id: "session-exclusion"
version: "1.0.0"
name: "Session Exclusion"
provider: "Alex Golunov"
description: "Add sessions with revoked ML consent to the compliance/excluded_sessions dataset"
icon: "${ASSET:app-session-exclusion@2x.png}"
badges: []
details_page: "task"

task {
  script {
    repository: "https://github.com/golunovas/clrml-custom-apps.git"
    entry_point: "exclude_sessions.py"
    working_dir: "session_exclusion_app"
    tag: ""
  }
  hyperparams {
    Args {
      session_ids: ""
      ticket: ""
      dataset_project: "compliance"
      dataset_name: "excluded_sessions"
    },
  }
}

wizard {
  entries: [
    {
      type: multiline_text
      name: session_ids
      title: Session IDs
      info: "Session IDs to exclude (24-character hex MongoDB ObjectIds), separated by newlines, spaces or commas"
      required: true
      target {
        field: hyperparams
        section: Args
        name: session_ids
      }
    },
    {
      type: string
      name: ticket
      title: Ticket / reason
      info: "Ticket ID or reason for the exclusion (stored with every added session)"
      required: true
      target {
        field: hyperparams
        section: Args
        name: ticket
      }
    }
  ]
}

dashboard {
  lines: [
    {
      contents: [
        {
          title: "Summary"
          type: plot
          metric: "Session exclusion"
          variant: "Summary"
        }
      ]
    },
    {
      contents: [
        {
          title: "Added sessions"
          type: plot
          metric: "Session exclusion"
          variant: "Added"
        }
      ]
    },
    {
      contents: [
        {
          title: "Rejected input"
          type: plot
          metric: "Session exclusion"
          variant: "Rejected"
        }
      ]
    }
  ]
}
